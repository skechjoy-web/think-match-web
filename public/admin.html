<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>THINK &amp; MATCH – Trang MC</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/tm.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="adm">
<!-- Trang quản trị: giao diện chỉ hiện sau khi đăng nhập; mọi thao tác đều được máy chủ kiểm tra quyền. -->
<div id="loginV" class="login" hidden>
  <div class="lbox">
    <div class="lbrand"><img src="assets/logo.png" alt="SKECHERS"><b>THINK &amp; MATCH</b></div>
    <div class="lang-mini"><button data-l="vi">VI</button><button data-l="en">EN</button></div>
    <div id="lMsg" class="lmsg"></div>
    <form id="loginF" hidden>
      <h1 data-t="Đăng nhập trang MC|Host sign-in"></h1>
      <label><span data-t="Email|Email"></span><input class="inp" type="email" id="lEmail" autocomplete="username" required></label>
      <label><span data-t="Mật khẩu|Password"></span><input class="inp" type="password" id="lPass" autocomplete="current-password" required></label>
      <button class="btn btn-primary wide" type="submit" data-t="Đăng nhập|Sign in"></button>
    </form>
    <form id="setupF" hidden>
      <h1 data-t="Tạo tài khoản Admin đầu tiên|Create the first admin"></h1>
      <p class="muted" data-t="Nhập mã khởi tạo hiện ra sau khi chạy tệp setup.sql trong Supabase, rồi đặt email và mật khẩu cho Admin.|Enter the setup code shown after running setup.sql in Supabase, then choose the admin email and password."></p>
      <label><span data-t="Mã khởi tạo|Setup code"></span><input class="inp" id="sCode" autocomplete="off" required></label>
      <label><span data-t="Email Admin|Admin email"></span><input class="inp" type="email" id="sEmail" autocomplete="username" required></label>
      <label><span data-t="Mật khẩu (ít nhất 8 ký tự)|Password (at least 8 characters)"></span><input class="inp" type="password" id="sPass" autocomplete="new-password" minlength="8" required></label>
      <button class="btn btn-primary wide" type="submit" data-t="Tạo Admin và đăng nhập|Create admin and sign in"></button>
    </form>
    <div id="needSetup" hidden>
      <h1 data-t="Cần khởi tạo cơ sở dữ liệu|Database setup needed"></h1>
      <ol class="steps">
        <li data-t="Mở Supabase của dự án → SQL Editor → New query.|Open your Supabase project → SQL Editor → New query."></li>
        <li><span data-t="Dán toàn bộ nội dung tệp|Paste the whole content of"></span> <a href="setup.sql" target="_blank">setup.sql</a> <span data-t="rồi bấm Run.|and press Run."></span> <button class="btn btn-ghost sm" id="copySql" type="button" data-t="Sao chép SQL|Copy SQL"></button></li>
        <li data-t="Kết quả cuối cùng là MA_KHOI_TAO: ghi lại mã đó, rồi tải lại trang này.|The last result is MA_KHOI_TAO: note that code, then reload this page."></li>
      </ol>
      <button class="btn btn-primary wide" type="button" onclick="location.reload()" data-t="Tải lại|Reload"></button>
    </div>
    <div id="notConf" hidden>
      <h1 data-t="Chưa kết nối Supabase|Supabase is not connected"></h1>
      <p class="muted" data-t="Trang web chưa có biến môi trường Supabase trên Vercel. Vào Vercel → Project → Storage → kết nối Supabase cho môi trường đang dùng, rồi triển khai lại.|The site has no Supabase environment variables on Vercel. In Vercel → Project → Storage, connect Supabase for this environment, then redeploy."></p>
    </div>
  </div>
</div>

<div id="appV" hidden>
  <header class="top">
    <div class="tb-brand"><img src="assets/logo.png" alt=""><b id="tbName">THINK &amp; MATCH</b><span class="role" id="tbRole"></span></div>
    <nav class="tabs" id="tabs">
      <button data-tab="ctl" class="on" data-t="Điều khiển|Controls"></button>
      <button data-tab="set" data-t="Cài đặt|Settings"></button>
      <button data-tab="bank" data-t="Ngân hàng câu hỏi|Question Bank"></button>
      <button data-tab="acc" data-admin data-t="Tài khoản|Accounts"></button>
      <button data-tab="his" data-t="Lịch sử|History"></button>
    </nav>
    <div class="tb-right">
      <span class="pill" id="connPill"></span>
      <button class="btn btn-gold" id="btnOpenPlayer" data-t="Mở màn hình người chơi|Open player screen"></button>
      <div class="lang-mini" id="langSw"><button data-l="vi">VI</button><button data-l="en">EN</button></div>
      <span class="who" id="tbUser"></span>
      <button class="btn btn-ghost" id="btnLogout" data-t="Đăng xuất|Sign out"></button>
    </div>
  </header>

  <main>
    <section class="tab on" id="tab-ctl">
      <div class="ctl">
        <div class="ccol">
          <div class="card status" id="cStatus"></div>
          <div class="card" id="cMatch"></div>
          <div class="card" id="cTeams"></div>
          <div class="card" id="cClocks"></div>
        </div>
        <div class="ccol wide">
          <div class="card" id="cFlow"></div>
          <div class="card">
            <div class="ch"><b data-t="Bảng ô|Board"></b><span class="muted" id="bHint"></span></div>
            <div class="bwrap" id="bWrap"><div class="bscale" id="bScale"><div class="board main" id="mBoard"></div></div></div>
          </div>
          <div class="card" id="cPick"></div>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-set"><div class="card" id="setForm"></div></section>
    <section class="tab" id="tab-bank"><div class="card" id="bankV"></div></section>
    <section class="tab" id="tab-acc"><div class="card" id="accV"></div></section>
    <section class="tab" id="tab-his"><div class="card" id="hisV"></div></section>
  </main>
</div>

<div class="modal-bg" id="dlg"><div class="modal adm-modal"><h2 id="dlgT"></h2><div id="dlgB"></div><div class="r" id="dlgR"></div></div></div>
<div class="atoast" id="toast"></div>
<input type="file" id="fileIn" hidden>

<script src="js/common.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
