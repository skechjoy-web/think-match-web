<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THINK &amp; MATCH – SKECHERS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#061334">
<link rel="icon" href="assets/icon-192.png">
<style>
:root{color-scheme:dark;
  --n950:#030a1f;--n900:#061334;--n850:#08184a;--n800:#0a1f4f;--n700:#0f2c6b;--n600:#16408f;
  --blue:#1e7bff;--sky:#3fb6ff;--cyan:#5fd4ff;--ice:#cfeeff;--muted:#9fcaf0;
  --gold:#ffc83d;--gold2:#ff9f1a;--green:#19c37d;--red:#ff4d5e;
  --line:rgba(120,190,255,.22);--glass:rgba(7,22,62,.82);
  --font:"Segoe UI","Segoe UI Variable Display",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--n950);font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font-family:inherit;user-select:text;-webkit-user-select:text}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--n900)}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
svg.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}
/* backgrounds */
.bg-photo{position:absolute;inset:0;background-size:cover;background-position:center}
.bg-ov{position:absolute;inset:0}
.speed{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.speed i{position:absolute;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(95,212,255,.55),transparent);transform:skewX(-30deg);opacity:.45;animation:speed 16s linear infinite;left:-30%}
.speed i:nth-child(1){top:14%;width:520px;animation-delay:-2s}
.speed i:nth-child(2){top:44%;width:380px;animation-delay:-9s;animation-duration:20s}
.speed i:nth-child(3){top:72%;width:640px;animation-delay:-5s;animation-duration:18s}
@keyframes speed{from{transform:translateX(0) skewX(-30deg)}to{transform:translateX(2900px) skewX(-30deg)}}
.no-motion .speed i{animation:none;opacity:.2}
.stripes{position:absolute;pointer-events:none;width:900px;height:900px;background:repeating-linear-gradient(-55deg,rgba(63,182,255,.10) 0 6px,transparent 6px 40px);-webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent)}
.wordmark{font-weight:900;font-style:italic;letter-spacing:.04em;line-height:1;white-space:nowrap}
.brand-logo{display:flex;align-items:center;justify-content:center}
.brand-logo img{display:block;height:100%;width:auto}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;font-weight:800;letter-spacing:.02em;transition:transform .12s,box-shadow .2s,opacity .2s,filter .2s;white-space:nowrap}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.3;filter:grayscale(.7);cursor:not-allowed}
.btn-primary{background:linear-gradient(180deg,#3a95ff,#1767e6);box-shadow:0 8px 22px rgba(30,123,255,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.btn-ghost{background:rgba(255,255,255,.06);border:1.5px solid rgba(160,210,255,.35)}
.btn-ghost:hover:not(:disabled){background:rgba(255,255,255,.13)}
.btn-ok{background:linear-gradient(180deg,#27d98e,#0fa865);box-shadow:0 8px 20px rgba(25,195,125,.35)}
.btn-no{background:linear-gradient(180deg,#ff6b78,#e2283b);box-shadow:0 8px 20px rgba(255,77,94,.35)}
.btn-gold{background:linear-gradient(180deg,#ffd76a,#ffb20f);color:#2a1a00;box-shadow:0 8px 22px rgba(255,200,61,.4)}
.btn-danger{background:rgba(255,77,94,.14);border:1.5px solid rgba(255,77,94,.6);color:#ffb3bb}
.btn.on{background:rgba(63,182,255,.3);border-color:#9fd6ff}
.cta:not(:disabled){box-shadow:0 0 0 3px #fff,0 0 24px 4px rgba(95,212,255,.7)!important}
.iconbtn{width:52px;height:52px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);border:1.5px solid rgba(160,210,255,.28);transition:background .2s;font-weight:900;font-size:17px;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.16)}
.iconbtn.off{color:#ff9aa5;border-color:rgba(255,77,94,.5)}
.iconbtn.lit{background:rgba(255,200,61,.22);border-color:var(--gold);color:var(--gold)}
.iconbtn:disabled{opacity:.35;cursor:not-allowed}
.lang{display:inline-flex;height:52px;border-radius:13px;border:1.5px solid rgba(160,210,255,.28);overflow:hidden;flex:none}
.lang button{padding:0 14px;font-weight:900;font-size:17px;color:#9fcaf0}
.lang button.on{background:linear-gradient(180deg,#3a95ff,#1767e6);color:#fff}

/* welcome */
#welcome .bg-ov{background:linear-gradient(180deg,rgba(3,10,31,.80),rgba(6,19,52,.88) 55%,rgba(3,10,31,.96)),radial-gradient(ellipse at 50% 40%,rgba(30,123,255,.25),transparent 60%)}
#welcome .center{position:absolute;left:0;right:0;top:150px;display:flex;flex-direction:column;align-items:center;text-align:center}
.w-logo{height:56px;margin-bottom:26px}
.w-logo .wordmark{font-size:64px}
.w-title{font-size:176px;font-weight:900;font-style:italic;line-height:1.04;letter-spacing:-.01em;background:linear-gradient(180deg,#ffffff 20%,#9fdcff 70%,#3fb6ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(30,123,255,.45));padding:0 40px;max-width:1500px;white-space:nowrap}
.w-bar{width:420px;height:6px;border-radius:6px;background:linear-gradient(90deg,transparent,var(--cyan),#fff,var(--cyan),transparent);margin:18px 0 24px}
.w-tag{font-size:42px;font-weight:700;color:#e8f6ff}
.w-btns{display:flex;gap:24px;margin-top:64px}
.w-btns .big{height:100px;padding:0 70px;font-size:42px;border-radius:22px}
.w-btns .mid{height:100px;padding:0 38px;font-size:26px;border-radius:22px}
.w-note{margin-top:24px;font-size:22px;color:#bfe3ff;min-height:40px;display:flex;gap:14px;align-items:center}
.w-note .btn{height:40px;padding:0 18px;font-size:18px}
.w-corner{position:absolute;right:36px;top:30px;display:flex;gap:10px}
.w-shoe{position:absolute;width:310px;height:250px;border-radius:26px;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.45),0 0 0 6px rgba(255,255,255,.12);overflow:hidden}
.w-shoe img{width:100%;height:100%;object-fit:contain;padding:12px}
.w-shoe.l{left:70px;top:620px;transform:rotate(-9deg)}
.w-shoe.r{right:70px;top:610px;transform:rotate(8deg)}
.w-shoe.l2{left:60px;top:270px;transform:rotate(6deg);width:240px;height:195px}
.w-shoe.r2{right:60px;top:260px;transform:rotate(-7deg);width:240px;height:195px}

/* game */
#game .bg-photo{opacity:.14;filter:blur(3px) saturate(.7)}
#game .bg-ov{background:radial-gradient(ellipse at 35% 45%,rgba(22,64,143,.55),transparent 65%),linear-gradient(180deg,rgba(6,19,52,.55),rgba(3,10,31,.88))}
.hdr{position:absolute;left:36px;right:36px;top:16px;height:84px;display:flex;align-items:center;gap:16px}
.h-brand{display:flex;align-items:center;gap:16px;flex:none;max-width:760px;min-width:0}
.h-logo{height:26px}
.h-logo .wordmark{font-size:30px}
.h-sep{width:2px;height:40px;background:rgba(160,210,255,.35);transform:skewX(-18deg);flex:none}
.h-title{font-size:32px;font-weight:900;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.h-clock{position:absolute;left:50%;top:0;transform:translateX(-50%);height:84px;display:flex;align-items:center;gap:16px;padding:0 26px;border-radius:20px;background:rgba(3,10,31,.6);border:1.5px solid rgba(160,210,255,.3)}
.h-clock .rb{font-size:18px;font-weight:900;letter-spacing:.16em;color:var(--cyan);text-align:right;line-height:1.25}
.h-clock .rb small{display:block;font-size:14px;letter-spacing:.05em;color:#9fcaf0;font-weight:700}
.h-clock .ct{font-size:58px;font-weight:900;letter-spacing:.02em;min-width:170px;text-align:center}
.h-clock.warn .ct{color:var(--red)}
.h-clock.idle .ct{color:rgba(255,255,255,.55)}
.h-tools{display:flex;gap:8px;margin-left:auto;flex:none}

.col{position:absolute;left:36px;top:112px;width:1388px;height:948px;transition:left .3s}
#game.collapsed .col{left:266px}
.teambar{position:absolute;left:0;right:0;top:0;height:140px;display:flex;gap:24px}
.tcard{position:relative;flex:1;border-radius:22px;background:rgba(7,22,62,.8);border:2px solid rgba(160,210,255,.2);display:flex;align-items:center;padding:0 26px 0 36px;gap:20px;overflow:hidden;transition:all .35s;opacity:.6}
.tcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--tc)}
.tcard .nm{flex:1;min-width:0}
.tcard .nm b{display:block;font-size:40px;font-weight:900;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.tcard .nm span{display:inline-block;margin-top:6px;font-size:16px;font-weight:900;letter-spacing:.16em;padding:4px 12px;border-radius:20px;background:var(--tc);color:#04102e;visibility:hidden}
.tcard .sc{font-size:88px;font-weight:900;line-height:1;min-width:90px;text-align:right}
.tcard .adj{display:none;flex-direction:column;gap:6px}
.adjusting .tcard .adj{display:flex}
.tcard .adj button{width:40px;height:36px;border-radius:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);font-size:24px;font-weight:900;line-height:1}
.tcard.cur{opacity:1;border-color:var(--tc);box-shadow:0 0 0 2px var(--tc),0 0 40px color-mix(in srgb,var(--tc) 45%,transparent);background:linear-gradient(110deg,color-mix(in srgb,var(--tc) 30%,#07163e),#07163e 70%)}
.tcard.cur .nm span{visibility:visible}
.tcard.bump .sc{animation:bump .9s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.5);color:var(--gold)}100%{transform:scale(1)}}
.tbox{width:400px;flex:none;border-radius:22px;background:rgba(3,10,31,.75);border:2px solid rgba(160,210,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;overflow:hidden}
.tbox .l{font-size:17px;font-weight:900;letter-spacing:.16em;color:var(--muted)}
.tbox .v{font-size:76px;font-weight:900;line-height:1}
.tbox .s{font-size:15px;font-weight:700;color:#9fcaf0;height:18px}
.tbox .bar{position:absolute;left:0;bottom:0;height:7px;background:linear-gradient(90deg,var(--cyan),var(--sky));transition:width .2s linear}
.tbox.warn{border-color:var(--red);box-shadow:0 0 30px rgba(255,77,94,.45)}
.tbox.warn .v{color:var(--red)}
.tbox.warn .bar{background:var(--red)}
.tbox.flip .v{color:var(--gold)}
.tbox.flip .bar{background:var(--gold)}
.tbox.idle .v{color:rgba(255,255,255,.35)}

.barea{position:absolute;left:0;right:0;top:162px;height:744px}
.board{position:absolute;display:grid;background:#0a1f4f center/cover no-repeat;border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 2px rgba(160,210,255,.25)}
.board.main{left:0;top:0;width:1388px;height:694px;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.board.small{left:234px;top:22px;width:920px;height:650px;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);background:transparent;box-shadow:none;gap:22px;overflow:visible}
.cell{position:relative;perspective:1600px}
.cover{position:absolute;inset:0;background:#081a47;transition:opacity .9s ease}
.board.small .cover{display:none}
.tile{position:absolute;inset:6px;cursor:default}
.board.small .tile{inset:0}
.tile .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.35,.75,.25,1),opacity .6s}
.tile.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(150deg,#1b4ea8 0%,#0f2f75 45%,#091d4d 100%);border:2px solid rgba(120,200,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:border-color .3s,box-shadow .3s}
.front::before{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:300px;background:repeating-linear-gradient(-60deg,rgba(255,255,255,.08) 0 5px,transparent 5px 22px)}
.front::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--sky),#fff 50%,var(--sky));opacity:.5}
.front .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:76px;font-weight:900;font-style:italic;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25),0 0 26px rgba(95,212,255,.45)}
.board.small .front .num{font-size:120px}
.back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 40%,#fff 55%,#eef6ff);border:3px solid #fff;overflow:visible}
.back .img{position:absolute;inset:6px;border-radius:12px;overflow:hidden}
.back .img img{width:100%;height:100%;object-fit:contain;display:block}
.back .badge{position:absolute;left:8px;top:8px;background:rgba(10,31,79,.88);color:#fff;font-weight:900;font-size:19px;border-radius:9px;padding:1px 10px;font-style:italic}
.back .xmark{position:absolute;right:10px;top:8px;width:54px;height:54px;opacity:0;transform:scale(1.8);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.tile.wrong .back .xmark{opacity:.9;transform:scale(1)}
.tile.wrong .back{box-shadow:0 0 0 4px rgba(255,77,94,.85),0 0 26px rgba(255,77,94,.45)}
.tile.win{z-index:3}
.tile.win .back{box-shadow:0 0 0 6px var(--gold),0 0 50px 12px rgba(255,200,61,.75)}
.tile.vanish .inner{transform:rotateY(180deg) scale(.4);opacity:0}
.cell.gone .tile{display:none}
.cell.gone .cover{opacity:0}
.board.pickable .cell:not(.gone) .tile:not(.open){cursor:pointer}
.board.pickable .cell:not(.gone) .tile:not(.open) .front{border-color:rgba(130,220,255,.95);box-shadow:0 0 0 2px rgba(95,212,255,.35),0 0 22px rgba(95,212,255,.35)}
.board.pickable .cell:not(.gone) .tile:not(.open):hover .front{border-color:#fff;background:linear-gradient(150deg,#2a66d1 0%,#1440a0 45%,#0b2563 100%)}
.pairs{position:absolute;left:0;right:0;top:708px;height:36px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:20px;font-weight:800;color:var(--muted)}
.pairs i{width:26px;height:26px;border-radius:50%;border:2px solid rgba(160,210,255,.45)}
.pairs i.f{background:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(255,200,61,.6)}
.small-cap{position:absolute;left:0;right:0;top:690px;text-align:center;font-size:22px;font-weight:800;color:var(--muted)}

/* banners */
.banner{position:absolute;left:0;right:0;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transform:scaleY(.2);transition:opacity .3s,transform .35s cubic-bezier(.2,1.4,.4,1);z-index:8;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.banner.show{opacity:1;transform:scaleY(1)}
.banner .b1{font-size:84px;font-weight:900;font-style:italic;line-height:1}
.banner .b2{font-size:34px;font-weight:800;margin-top:10px}
.banner.ok{background:linear-gradient(90deg,rgba(6,60,45,.97),rgba(9,90,66,.97) 50%,rgba(6,60,45,.97));border:2px solid rgba(93,255,183,.6)}
.banner.ok .b1{color:#5dffb7}
.banner.no{background:linear-gradient(90deg,rgba(80,6,20,.97),rgba(120,12,30,.97) 50%,rgba(80,6,20,.97));border:2px solid rgba(255,133,146,.6)}
.banner.no .b1{color:#ff8592}
.banner.win{background:linear-gradient(90deg,rgba(40,24,0,.96),rgba(80,50,0,.96) 50%,rgba(40,24,0,.96));border:2px solid rgba(255,200,61,.75)}
.banner.win .b1{background:linear-gradient(180deg,#fff5c4,#ffc83d 55%,#ff9f1a);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:100px}
.banner.win .b2{color:#ffe7a3}
.banner.info{background:linear-gradient(90deg,rgba(8,30,80,.97),rgba(14,50,130,.97) 50%,rgba(8,30,80,.97));border:2px solid rgba(160,220,255,.6)}
.banner.info .b1{color:#bfe8ff}
/* big question & estimate */
.qbig{position:absolute;left:0;top:0;width:1388px;height:744px;z-index:6;border-radius:22px;background:linear-gradient(160deg,rgba(14,44,110,.98),rgba(5,16,46,.99));border:2px solid rgba(120,200,255,.45);box-shadow:0 30px 80px rgba(0,0,0,.6);display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 90px;text-align:center}
.qbig.show{display:flex;animation:fadeup .35s ease-out}
@keyframes fadeup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.qbig .ql{font-size:30px;font-weight:900;letter-spacing:.22em;color:var(--cyan);margin-bottom:28px}
.qbig .ql span{display:inline-block;padding:6px 26px;border-radius:40px;border:2px solid var(--cyan)}
.qbig .qt{font-size:60px;font-weight:800;line-height:1.25;max-width:1180px;overflow-wrap:anywhere}
.est{position:absolute;inset:0;border-radius:22px;background:linear-gradient(160deg,rgba(14,44,110,.96),rgba(5,16,46,.98));border:2px solid rgba(255,200,61,.45);display:flex;flex-direction:column;align-items:center;padding:50px 60px;text-align:center}
.est .ql{font-size:28px;font-weight:900;letter-spacing:.2em;color:var(--gold)}
.est .qt{font-size:54px;font-weight:800;line-height:1.25;margin-top:22px;max-width:1200px;overflow-wrap:anywhere;min-height:140px;display:flex;align-items:center}
.est .cols{display:flex;gap:26px;margin-top:auto;width:100%}
.est .c{flex:1;border-radius:20px;background:rgba(255,255,255,.06);border:2px solid rgba(160,210,255,.25);padding:22px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.est .c .t{font-size:24px;font-weight:900;letter-spacing:.1em;color:var(--muted)}
.est .c .n{font-size:68px;font-weight:900}
.est .c .d{font-size:24px;font-weight:800;color:#bfe3ff}
.est .c.win{border-color:var(--gold);box-shadow:0 0 40px rgba(255,200,61,.5);background:rgba(255,200,61,.12)}
.est .c.std .n{color:var(--gold)}
.est .msg{font-size:34px;font-weight:900;margin-top:20px;min-height:44px;color:var(--gold)}
.pauseov{position:absolute;inset:0;z-index:30;background:rgba(2,8,26,.62);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px}
.paused .pauseov{display:flex}
.pauseov b{font-size:110px;font-weight:900;font-style:italic;letter-spacing:.04em}
.pauseov .btn{height:72px;padding:0 44px;font-size:28px}
.paused *{animation-play-state:paused!important}

/* MC panel */
.panel{position:absolute;left:1448px;top:112px;width:436px;height:948px;border-radius:24px;background:var(--glass);border:1.5px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.35);padding:16px 18px;display:flex;flex-direction:column;gap:10px;transition:transform .3s,opacity .3s;z-index:12}
#game.collapsed .panel{transform:translateX(480px);opacity:0;pointer-events:none}
.p-head{display:flex;align-items:center;justify-content:space-between}
.p-head b{font-size:15px;font-weight:900;letter-spacing:.2em;color:var(--muted)}
.p-head .btn{height:34px;padding:0 12px;font-size:14px;border-radius:9px}
.hint{font-size:18px;font-weight:700;line-height:1.35;background:rgba(30,123,255,.22);border:1px solid rgba(95,212,255,.35);border-radius:12px;padding:9px 12px}
.sec{font-size:14px;font-weight:900;letter-spacing:.16em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.sec span{letter-spacing:0;font-weight:700}
.qg{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.qg button{height:36px;border-radius:8px;font-size:16px;font-weight:900;background:rgba(255,255,255,.08);border:1.5px solid rgba(160,210,255,.3)}
.qg button:hover:not(:disabled){background:rgba(63,182,255,.3)}
.qg button.used{color:rgba(255,255,255,.3);text-decoration:line-through;border-style:dashed;background:transparent}
.qg button.sel{background:linear-gradient(180deg,#3a95ff,#1767e6);border:2px solid #fff;text-decoration:none;color:#fff}
.qg button.bk{border-color:rgba(255,200,61,.5)}
.qg button:disabled{cursor:not-allowed;opacity:.35}

.row{display:flex;gap:8px}

/* result */

.rays{position:absolute;left:50%;top:520px;width:1800px;height:1800px;margin:-900px 0 0 -900px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,200,61,.18) 0deg 7deg,transparent 7deg 20deg);-webkit-mask-image:radial-gradient(closest-side,#000 10%,transparent 75%);mask-image:radial-gradient(closest-side,#000 10%,transparent 75%);opacity:0}
#result.active .rays{animation:raysin 1.8s ease-out forwards,spin 90s linear infinite}

.r-top .brand-logo{height:30px}

.r-top .pn{font-size:40px;font-weight:900;font-style:italic;letter-spacing:.02em}
.r-cong{position:absolute;left:0;right:0;top:150px;text-align:center;font-size:58px;font-weight:900;font-style:italic;letter-spacing:.02em;background:linear-gradient(180deg,#fff8d6 10%,#ffd25a 55%,#ff9f1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 24px rgba(255,170,0,.5));padding:0 40px}
.r-team{position:absolute;left:0;right:0;top:250px;text-align:center;font-size:200px;font-weight:900;font-style:italic;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 60px;text-shadow:0 10px 50px rgba(0,0,0,.5)}
#result.active .r-team{animation:heroin 1s cubic-bezier(.2,1.3,.4,1)}
@keyframes heroin{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.r-tag{position:absolute;left:0;right:0;top:488px;display:flex;justify-content:center;min-height:56px}
.r-tag span{font-size:28px;font-weight:900;letter-spacing:.06em;padding:8px 26px;border-radius:40px;background:rgba(255,200,61,.18);border:2px solid var(--gold);color:var(--gold)}
.r-scores{position:absolute;left:0;right:0;top:612px;display:flex;justify-content:center;gap:40px}
.r-sc{width:460px;border-radius:22px;background:rgba(5,16,46,.75);border:2px solid rgba(160,210,255,.3);padding:20px 28px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.r-sc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:12px;background:var(--tc)}
.r-sc .n{flex:1;font-size:34px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:10px}
.r-sc .s{font-size:72px;font-weight:900}
.r-sc .u{font-size:20px;color:var(--muted);font-weight:800}

.r-sc-cap{position:absolute;left:0;right:0;top:572px;text-align:center;font-size:18px;font-weight:900;letter-spacing:.2em;color:var(--muted)}
.r-msg{position:absolute;left:0;right:0;top:800px;text-align:center;font-size:40px;font-weight:800;padding:0 120px;line-height:1.35}
.r-btns{position:absolute;right:30px;bottom:24px;display:flex;gap:10px;opacity:.8}
.r-btns:hover{opacity:1}
.r-btns .btn{height:46px;padding:0 20px;font-size:16px;border-radius:11px}

/* confetti / toast / modal */
#fx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:50}
.toast{position:absolute;left:50%;bottom:30px;transform:translate(-50%,30px);background:rgba(8,24,70,.97);border:1.5px solid rgba(160,210,255,.45);padding:14px 26px;border-radius:14px;font-size:22px;font-weight:700;opacity:0;pointer-events:none;transition:all .3s;z-index:90;max-width:1300px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{border-color:var(--red);background:rgba(80,8,20,.97)}
.toast.good{border-color:var(--green)}
.modal-bg{position:absolute;inset:0;background:rgba(2,8,26,.72);z-index:60;display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
#confirmM{z-index:70}
.modal{background:linear-gradient(170deg,#0f2a66,#081a47);border:1.5px solid rgba(160,210,255,.35);border-radius:26px;box-shadow:0 40px 100px rgba(0,0,0,.6);position:relative}
.modal h2{font-size:34px;font-weight:900;font-style:italic}
.x-close{position:absolute;right:20px;top:18px}
#confirmM .modal{width:780px;padding:40px 44px}
#confirmM p{font-size:24px;line-height:1.45;margin:18px 0 30px;color:#dcefff}
#confirmM .r{display:flex;gap:14px;justify-content:flex-end}
#confirmM .btn{height:60px;padding:0 30px;font-size:21px}
#setupM .modal{width:980px;padding:40px 46px}
#setupM .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:26px 0}
#setupM .r{display:flex;gap:14px;justify-content:flex-end}
#setupM .btn{height:62px;padding:0 34px;font-size:22px}
#helpM .modal{width:1320px;padding:40px 50px}
.help-cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:20px}
.help-cols div{background:rgba(255,255,255,.05);border:1px solid rgba(160,210,255,.2);border-radius:16px;padding:18px 22px;font-size:19px;line-height:1.5;color:#dcefff}
.help-cols b{display:block;color:#fff;font-size:23px;margin-bottom:6px}
.help-cols li{margin-left:22px}
.help-keys{margin-top:18px;font-size:18px;color:#9fcaf0}
.help-keys kbd{display:inline-block;background:#fff;color:var(--n900);border-radius:6px;padding:1px 9px;font-weight:900;margin:0 3px;font-family:inherit}
/* settings */
#setM .modal{width:1640px;height:960px;display:flex;flex-direction:column;overflow:hidden}
.set-top{display:flex;align-items:center;gap:20px;padding:24px 34px 16px;border-bottom:1px solid rgba(160,210,255,.18)}
.set-top h2{flex:1}
.set-body{flex:1;display:flex;min-height:0}
.set-tabs{width:270px;padding:18px 14px;border-right:1px solid rgba(160,210,255,.18);display:flex;flex-direction:column;gap:6px}
.set-tabs button{text-align:left;padding:14px 16px;border-radius:13px;font-size:20px;font-weight:800;color:#bcd9f5;display:flex;gap:12px;align-items:center}
.set-tabs button b{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.set-tabs button.on{background:linear-gradient(90deg,rgba(30,123,255,.5),rgba(30,123,255,.15));color:#fff}
.set-tabs button.on b{background:#fff;color:#1767e6}
.set-pane{flex:1;overflow-y:auto;padding:24px 34px 30px;display:none}
.set-pane.on{display:block}
.set-pane::-webkit-scrollbar{width:12px}.set-pane::-webkit-scrollbar-thumb{background:rgba(160,210,255,.3);border-radius:8px}
.set-pane h3{font-size:23px;font-weight:900;margin:2px 0 6px}
.set-pane .note{font-size:17px;color:#9fcaf0;line-height:1.45;margin-bottom:16px}
.fld{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.fld label,.flabel2{font-size:16px;font-weight:800;color:#bcd9f5}
.inp{height:50px;border-radius:12px;border:1.5px solid rgba(160,210,255,.35);background:rgba(0,0,0,.28);color:#fff;font-size:20px;padding:0 14px;outline:none;width:100%}
.inp:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(95,212,255,.25)}
textarea.inp{height:auto;min-height:50px;padding:10px 14px;resize:vertical;line-height:1.35;font-size:18px}
.inp::placeholder{color:rgba(255,255,255,.32)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.box{border:1.5px solid rgba(160,210,255,.2);border-radius:18px;padding:18px 20px;background:rgba(0,0,0,.15);margin-bottom:18px}
.logo-prev{height:110px;border-radius:14px;background:repeating-conic-gradient(#14326f 0 25%,#0d2557 0 50%) 0 0/24px 24px;display:flex;align-items:center;justify-content:center;padding:14px;margin:8px 0 12px;overflow:hidden}
.logo-prev img{max-height:82px;max-width:100%}
.logo-prev .wordmark{font-size:54px}
.radios{display:flex;gap:10px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.06);border:1.5px solid rgba(160,210,255,.25);font-size:17px;font-weight:700;cursor:pointer}
.radios input{width:19px;height:19px;accent-color:var(--blue)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{height:46px;padding:0 18px;font-size:16px}
.shoes-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.slot{border-radius:16px;background:rgba(255,255,255,.05);border:1.5px solid rgba(160,210,255,.22);padding:10px;display:flex;flex-direction:column;gap:7px}
.slot .ph{height:130px;border-radius:11px;background:#fff;overflow:hidden}
.slot .ph img{width:100%;height:100%;object-fit:contain;padding:6px}
.slot .hd{display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:900}
.slot .st{font-size:12px;font-weight:700;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.1);color:#bcd9f5}
.slot .st.cus{background:rgba(25,195,125,.25);color:#7dffc4}
.slot .st.tmp{background:rgba(255,77,94,.25);color:#ffb3bb}
.slot .bb{display:flex;gap:6px}
.slot .bb .btn{flex:1;height:38px;font-size:14px;padding:0 4px;border-radius:9px}
.selgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}
.selgrid select{height:46px;font-size:17px}
.qsub{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.qsub button{height:44px;padding:0 16px;border-radius:11px;font-size:17px;font-weight:800;background:rgba(255,255,255,.06);border:1.5px solid rgba(160,210,255,.3)}
.qsub button.on{background:linear-gradient(180deg,#3a95ff,#1767e6);border-color:#9fd6ff}
.qhead,.qline{display:grid;grid-template-columns:58px 1fr 1fr 230px 230px;gap:10px;align-items:start}
.qhead{font-size:14px;font-weight:900;letter-spacing:.1em;color:#9fcaf0;margin-bottom:6px}
.qline{margin-bottom:8px}
.qline.est{grid-template-columns:58px 1fr 1fr 230px}
.qhead.est{grid-template-columns:58px 1fr 1fr 230px}
.qline .no{height:50px;border-radius:12px;background:rgba(30,123,255,.3);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900}
.qline .no.bk{background:rgba(255,200,61,.3)}
.switch{display:flex;align-items:center;gap:14px;font-size:19px;font-weight:800;cursor:pointer;padding:10px 0}
.switch input{appearance:none;-webkit-appearance:none;width:62px;height:34px;border-radius:34px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{left:32px}
.teamline{display:grid;grid-template-columns:110px 90px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.teamline .no{font-size:19px;font-weight:900;color:#bcd9f5}
input[type=color]{width:90px;height:50px;border-radius:12px;border:1.5px solid rgba(160,210,255,.35);background:transparent;padding:4px;cursor:pointer}
.rng{display:flex;align-items:center;gap:16px;font-size:19px;font-weight:800}
.rng input{flex:1;accent-color:var(--cyan);height:30px}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.tgrid .fld .inp{text-align:center;font-size:26px;font-weight:900}
.tgrid .u{font-size:15px;color:#9fcaf0;text-align:center}
.audio-st{font-size:16px;font-weight:700;color:#9fcaf0;margin:6px 0 10px}
.audio-st.ok{color:#7dffc4}.audio-st.warn{color:#ffcf7a}
.set-foot{display:flex;align-items:center;gap:14px;padding:16px 34px;border-top:1px solid rgba(160,210,255,.18);background:rgba(0,0,0,.18)}
.set-foot .msg{flex:1;font-size:18px;font-weight:700;color:#9fcaf0}
.set-foot .msg.ok{color:#7dffc4}.set-foot .msg.err{color:#ff9aa5}
.set-foot .btn{height:54px;padding:0 28px;font-size:19px}
.usage{font-size:16px;color:#9fcaf0;margin-top:8px}
@media (prefers-reduced-motion:reduce){.speed i{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <!-- WELCOME -->
  <section id="welcome" class="screen active">
    <div class="bg-photo js-bg"></div><div class="bg-ov"></div>
    <div class="stripes" style="left:-260px;top:-240px"></div><div class="stripes" style="right:-300px;bottom:-320px"></div>
    <div class="speed"><i></i><i></i><i></i></div>
    <div class="w-shoe l2"><img class="js-shoe" data-slot="0" alt=""></div>
    <div class="w-shoe r2"><img class="js-shoe" data-slot="6" alt=""></div>
    <div class="w-shoe l"><img class="js-shoe" data-slot="1" alt=""></div>
    <div class="w-shoe r"><img class="js-shoe" data-slot="13" alt=""></div>
    <div class="w-corner">
      <div class="lang js-lang"><button data-l="vi">VI</button><button data-l="en">EN</button></div>
      <button class="iconbtn js-music" data-i18n-title="music"></button>
      <button class="iconbtn js-help" data-i18n-title="help"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.2 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.5"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></svg></button>
      <button class="iconbtn js-sound" data-i18n-title="sfx"></button>
      <button class="iconbtn js-fs" data-i18n-title="fullscreen"></button>
    </div>
    <div class="center">
      <div class="w-logo brand-logo js-logo"></div>
      <div class="w-title js-pname">THINK &amp; MATCH</div>
      <div class="w-bar"></div>
      <div class="w-tag js-tagline"></div>
      <div class="w-btns">
        <button class="btn btn-primary big" id="btnStart"></button>
        <button class="btn btn-ghost mid" id="btnPractice" data-i18n="practice"></button>
        <button class="btn btn-ghost mid js-settings" data-i18n="settingsBtn"></button>
      </div>
      <div class="w-note" id="wNote"></div>
    </div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">

    <div class="speed"><i></i><i></i><i></i></div>

      <div class="h-tools">
        <div class="lang js-lang"><button data-l="vi">VI</button><button data-l="en">EN</button></div>
        <button class="iconbtn js-music" data-i18n-title="music"></button>
        <button class="iconbtn js-sound" data-i18n-title="sfx"></button>
        <button class="iconbtn" id="btnPause" data-i18n-title="pauseGame"></button>
        <button class="iconbtn js-fs" data-i18n-title="fullscreen"></button>
        <button class="iconbtn" id="btnCollapse" data-i18n-title="collapse"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
        <button class="iconbtn js-help" data-i18n-title="help"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.2 9a3 3 0 0 1 5.8 1c0 2-3 2.5-3 4.5"/><circle cx="12" cy="18" r=".6" fill="currentColor"/></svg></button>
        <button class="iconbtn js-settings" data-i18n-title="settingsBtn"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
        <button class="iconbtn" id="btnHome" data-i18n-title="home"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
      </div>

    <div class="col" id="col">
      <div class="teambar" id="teambar">
        <div class="tcard" data-t="0"><div class="nm"><b></b><span></span></div><div class="adj"><button data-d="1">+</button><button data-d="-1">−</button></div><div class="sc tnum">0</div></div>

        <div class="qbig" id="qbig"><div class="ql"><span id="qbNo"></span></div><div class="qt" id="qbText"></div></div>
        <div class="banner" id="banner"><div class="b1"></div><div class="b2"></div></div>
      </div>
    </div>
    <aside class="panel" id="panel"></aside>
    <button class="showpanel" id="btnShowPanel">MC</button>
    <div class="pauseov"><b data-i18n="pausedBig"></b><button class="btn btn-primary" id="btnResume" data-i18n="resumeGame"></button></div>
  </section>

/* ================= audio ================= */
let ac=null,master=null;
function audio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination)}if(ac.state==='suspended')ac.resume()}catch(e){ac=null}if(master)master.gain.value=S.sfxVol;return ac}

function tone(f,t0,d,type,vol,f2){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';const t=ac.currentTime+t0;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(master);o.start(t);o.stop(t+d+.05)}
function noise(t0,d,vol,hp){if(!ac)return;const b=ac.createBuffer(1,Math.max(1,ac.sampleRate*d|0),ac.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);
  const s=ac.createBufferSource();s.buffer=b;const g=ac.createGain();g.gain.value=vol;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp||1800;s.connect(f).connect(g).connect(master);s.start(ac.currentTime+t0)}
let fanUntil=0;
function sfx(n){if(!S.sfx||!audio())return;
  switch(n){
    case 'click':tone(880,0,.06,'triangle',.07);break;
    case 'flip':noise(0,.12,.12);tone(520,0,.12,'triangle',.08,780);break;
    case 'tick':tone(1320,0,.09,'sine',.16);break;
    case 'right':[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.25,'triangle',.18));break;
    case 'wrong':tone(196,0,.28,'sawtooth',.12,150);tone(147,.25,.4,'sawtooth',.12,110);break;
    case 'timeout':tone(440,0,.22,'square',.1);tone(330,.24,.22,'square',.1);tone(220,.48,.5,'sawtooth',.12,180);break;
    case 'match':[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.08,.3,'square',.07));[1047,1319,1568].forEach(f=>tone(f,.45,.7,'triangle',.12));noise(.4,.35,.06);break;
    case 'miss':tone(330,0,.18,'square',.07);tone(247,.18,.32,'square',.07);break;
    case 'boom':noise(0,.6,.25,200);tone(90,0,.5,'sine',.25,40);break;
  }}

  const m=[[523,0,.18],[523,.2,.18],[523,.4,.18],[659,.6,.5],[587,1.15,.2],[659,1.35,.2],[784,1.55,1.2]];
  m.forEach(([f,s,d])=>{tone(f,s,d+.1,'sawtooth',.09);tone(f*2,s,d+.1,'triangle',.07)});[523,659,784,1047].forEach(f=>tone(f,1.55,1.6,'triangle',.08));noise(1.5,.8,.07)}

function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=rnd(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
const CLN=['main','ans','flip','hold','tie'];
function totalFor(n){const T=S.times;return Math.round({main:T.main*60000,ans:T.answer*1000,flip:T.flip*1000,hold:T.hold*1000,tie:T.tie*60000}[n])}

function freshGame(first){const deck=[];for(let p=0;p<8;p++)deck.push(p,p);shuffle(deck);

function validGame(g){try{if(!g||!g.m||!Array.isArray(g.m.deck)||g.m.deck.length!==16)return false;const c=Array(8).fill(0);g.m.deck.forEach(p=>c[p]++);return c.every(x=>x===2)&&g.clocks&&CLN.every(n=>g.clocks[n])}catch(e){return false}}

/* ================= clock engine ================= */
const CK=()=>mode==='practice'?P.clocks:G.clocks;
function cset(n,run){const c=CK()[n];c.total=totalFor(n);c.remain=c.total;c.running=!!run}
function cstop(n){CK()[n].running=false}
function after(ms,fn){tasks.push({r:ms,fn})}
let lastT=performance.now();
setInterval(()=>{const now=performance.now();const dt=(now-lastT)*speed;lastT=now;
  if(paused||screen!=='game')return;
  const C=CK();
  for(const n of CLN){const c=C[n];if(!c.running)continue;const before=Math.ceil(c.remain/1000);c.remain-=dt;
    if(n==='ans'&&c.remain>0){const s=Math.ceil(c.remain/1000);if(s!==before&&s<=5)sfx('tick')}
    if(c.remain<=0){c.remain=0;c.running=false;expire(n)}}
  if(tasks.length){const due=[];tasks.forEach(k=>{k.r-=dt;if(k.r<=0)due.push(k)});if(due.length){tasks=tasks.filter(k=>k.r>0);due.forEach(k=>{try{k.fn()}catch(e){console.error(e)}})}}
  renderClocks();
  if(mode==='match'&&now-lastSave>1000)save();
},100);
function expire(n){
  if(mode==='practice'){if(n==='ans')prJudge(false,true);else if(n==='flip')flipTimeout();else if(n==='hold')holdDone();return}
  if(G.stage==='main'){if(n==='main')mainClockEnd();else if(n==='ans')mainJudge(false,true);else if(n==='flip')flipTimeout();else if(n==='hold')holdDone()}
  else if(G.stage==='tie'){if(n==='tie')tieClockEnd();else if(n==='ans')tieJudge(false,true);else if(n==='flip')flipTimeout();else if(n==='hold')holdDone()}

const DEMO_B=Array.from({length:6},(_,i)=>{const a=i+6,b=i+3;return['[Demo] '+a+' × '+b+' = ?',String(a*b)]});
const DEMO_T=Array.from({length:5},(_,i)=>{const a=50+i*13,b=17+i*4;return['[Demo] '+a+' − '+b+' = ?',String(a-b)]});

function qObj(ref){if(!ref)return null;if(ref.s==='m')return S.qMain[ref.i];if(ref.s==='b')return S.qBackup[ref.i];if(ref.s==='x')return G.m.extra[ref.i];if(ref.s==='t')return S.qTie[ref.i];return null}

function qLabel(ref){const n=pad(ref.i+1);return{m:tt('CÂU ','QUESTION ')+n,b:tt('DỰ PHÒNG ','BACKUP ')+(ref.i+1),x:tt('BỔ SUNG ','EXTRA ')+(ref.i+1),t:tt('CÂU PHỤ ','TIE Q')+(ref.i+1)}[ref.s]}

function onTile(kind,i){const c=ctx();if(!c||c.kind!==kind)return;const st=c.st;
  if(busy||paused)return;
  if(st.phase!=='flip'){if(!(st.matched&&st.matched[i]))toast(tt('Ô đang khóa: cần trả lời đúng trước khi lật.','Tiles are locked until a correct answer.'));return}
  if((st.matched&&st.matched[i])||st.picks.includes(i)||st.picks.length>=2)return;
  st.picks.push(i);openCell(c.cells[i],shoeFor(st,i));sfx('flip');
  if(st.picks.length<2){if(mode==='match')save();renderPanel();renderHint();return}
  cstop('flip');st.phase='resolve';busy=true;
  const [a,b]=st.picks,match=st.deck[a]===st.deck[b];
  if(mode==='match'&&G.stage==='main'&&match){G.m.matched[a]=G.m.matched[b]=true;G.m.scores[G.m.turn]++}
  if(mode==='match'&&G.stage==='tie'&&match){G.r={winner:G.t.answering,via:'tie'};G.t.phase='ended'}

}
function resolveShow(c,a,b,match){

  if(match){[a,b].forEach(k=>c.cells[k].querySelector('.tile').classList.add('win'));sfx('match');
    [a,b].forEach(k=>{const r=c.cells[k].getBoundingClientRect(),sr=stage.getBoundingClientRect(),sc=sr.width/1920;fx.burst((r.left+r.width/2-sr.left)/sc,(r.top+r.height/2-sr.top)/sc,80)});fx.rain(1500,4);
    if(mode==='practice'){banner('win',tt('GHÉP ĐÚNG!',"IT'S A MATCH!"),tt('Chơi thử — không tính điểm','Practice — no points'),0,null);after(2000,()=>{vanish(c,a,b,()=>{P.matched[a]=P.matched[b]=true;endPracticeTurn()})});return}

      banner('win',tt('GHÉP ĐÚNG!',"IT'S A MATCH!"),fmt(tt('+1 điểm cho {t}','+1 point for {t}'),{t:teamName(G.m.turn)}),0,row);renderPairs();

    else{banner('win',tt('CHIẾN THẮNG!','WINNER!'),fmt(tt('{t} tìm được cặp quyết định','{t} found the decisive pair'),{t:teamName(G.r.winner)}),0,null);

function startTie(live){G.stage='tie';G.t={deck:shuffle([0,0,1,2]),started:false,q:null,used:Array(5).fill(false),answering:null,tried:[],phase:'question',picks:[],ansShown:false};

  if(ok){T.phase='flip';T.picks=[];cset('flip',true);sfx('right');banner('ok',tt('CHÍNH XÁC!','CORRECT!'),tt('MỜI LẬT 2 Ô','FLIP 2 TILES'),1600);save();render();return}
  T.tried.push(T.answering);sfx(timeout?'timeout':'wrong');const other=1-T.answering;
  if(!T.tried.includes(other)){T.answering=other;cset('ans',G.clocks.tie.remain>0);banner('no',timeout?tt('HẾT GIỜ!',"TIME'S UP!"):tt('CHƯA CHÍNH XÁC','INCORRECT'),fmt(tt('{t} được quyền trả lời','{t} may answer now'),{t:teamName(other)}),2200);save();render()}
  else{T.used[T.q.i]=true;banner('no',tt('CẢ HAI ĐỘI CHƯA ĐÚNG','BOTH TEAMS MISSED'),tt('Chuyển sang câu hỏi mới','Moving to a new question'),2200);tieNextQ()}}
function tieAfterMiss(){if(G.t.q)G.t.used[G.t.q.i]=true;tieNextQ()}
function tieNextQ(){const T=G.t;T.q=null;T.answering=null;T.tried=[];T.phase='question';T.picks=[];T.ansShown=false;cset('ans',false);cset('flip',false);busy=false;bigQ=false;
  if(G.clocks.tie.remain<=0||!tieAvail().length){toEstimate(G.clocks.tie.remain<=0?'time':'noq');return}save();render()}
function tieClockEnd(){sfx('timeout');const T=G.t;if(T.phase==='resolve'||T.phase==='ended')return;
  if(T.phase==='flip'){cstop('flip');const c=ctx();busy=true;T.picks.forEach(k=>closeCell(c.cells[k]));T.picks=[];save();after(FLIP_MS,()=>{busy=false;toEstimate('time')});return}
  cstop('ans');toEstimate('time')}
async function toEstimateNow(){if(busy)return;if(!await confirmBox(tt('Chuyển sang câu ước lượng?','Go to the estimation question?'),tt('Vòng phụ dừng lại và hai đội phân định bằng câu hỏi ước lượng.','The tie-breaker stops and the teams are separated by an estimation question.'),tt('Chuyển','Continue')))return;toEstimate('manual')}
function estPrep(pi){const o=S.qEst[pi]||{};const en=L()==='en';let q=en?((o.en||'').trim()||(o.vi||'').trim()):((o.vi||'').trim()||(o.en||'').trim());let a=(o.ans||'').trim();if(!q&&S.demo){q=DEMO_E[pi][0];a=a||DEMO_E[pi][1]}return{q,a}}
function toEstimate(why){['tie','ans','flip','hold'].forEach(cstop);G.stage='estimate';const p=estPrep(0);G.e={pi:0,q:p.q,correct:p.a,a:['',''],shown:false,result:null,round:1};busy=false;bigQ=false;save();render();
  sfx('boom');banner('info',tt('CÂU HỎI ƯỚC LƯỢNG','ESTIMATION QUESTION'),why==='time'?tt('Hết giờ vòng phụ — đội gần đáp án nhất sẽ thắng','Tie-breaker time is up — the closest answer wins'):tt('Đội có đáp án gần đúng nhất sẽ thắng','The closest answer wins'),3200)}
function parseNum(s){s=String(s||'').trim().replace(/\s/g,'');if(!s)return NaN;
  if(s.indexOf('.')>=0&&s.indexOf(',')>=0){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
  else if(s.indexOf(',')>=0){s=/^-?\d{1,3}(,\d{3})+$/.test(s)?s.replace(/,/g,''):s.replace(',','.')}
  else if(/^-?\d{1,3}(\.\d{3}){2,}$/.test(s))s=s.replace(/\./g,'');
  return /^-?\d*\.?\d+$/.test(s)?parseFloat(s):NaN}
function fmtNum(n){return(Math.round(n*1000)/1000).toLocaleString(L()==='en'?'en-US':'vi-VN')}
function estCompare(){const E=G.e;const c=parseNum(E.correct),a0=parseNum(E.a[0]),a1=parseNum(E.a[1]);
  if([c,a0,a1].some(isNaN)){toast(tt('Hãy nhập đủ 3 con số hợp lệ: đáp án chuẩn và đáp án của hai đội.','Enter three valid numbers: the correct answer and both teams’ answers.'),'err');return}
  const d=[Math.abs(a0-c),Math.abs(a1-c)];const eq=Math.abs(d[0]-d[1])<1e-9;E.result={c,a:[a0,a1],d,winner:eq?null:(d[0]<d[1]?0:1)};E.shown=true;sfx(eq?'miss':'match');save();render()}
function estNew(){const E=G.e;const pi=E.pi>=0&&E.pi+1<S.qEst.length?E.pi+1:-1;const p=pi>=0?estPrep(pi):{q:'',a:''};G.e={pi,q:p.q,correct:p.a,a:['',''],shown:false,result:null,round:E.round+1};save();render()}

async function act(a,d){
  if(paused&&['collapse'].indexOf(a)<0){toast(tt('Game đang tạm dừng. Bấm Tiếp tục trước.','The game is paused. Press Resume first.'));return}
  const C=CK();
  switch(a){
    case 'collapse':toggleCollapse();break;
    case 'first':G.m.first=+d.v;G.m.turn=+d.v;save();render();break;
    case 'startMain':startMain();break;
    case 'q':if(d.s==='t')tieSelectQ(+d.i);else mainSelectQ({s:d.s,i:+d.i});break;
    case 'big':bigQ=!bigQ;render();break;
    case 'ans':if(G.stage==='main')G.m.ansShown=!G.m.ansShown;else if(G.t)G.t.ansShown=!G.t.ansShown;save();render();break;
    case 'ansToggle':{const c=C.ans;if(c.remain<=0)break;c.running=!c.running;if(c.running)sfx('click');render();break}
    case 'ansReset':cset('ans',false);render();break;
    case 'right':if(mode==='practice')prJudge(true);else if(G.stage==='main')mainJudge(true);else tieJudge(true);break;
    case 'wrong':if(mode==='practice')prJudge(false);else if(G.stage==='main')mainJudge(false);else tieJudge(false);break;
    case 'flipToggle':C.flip.running=!C.flip.running;render();break;
    case 'flipReset':{const c=C.flip;c.remain=c.total=totalFor('flip');render();break}
    case 'mainToggle':if(G.clocks.main.remain>0){G.clocks.main.running=!G.clocks.main.running;save();render()}break;
    case 'mainReset':if(await confirmBox(tt('Đặt lại đồng hồ vòng chính?','Reset the main round clock?'),fmt(tt('Đồng hồ quay về {v} và dừng. Bấm Tiếp tục đồng hồ để chạy lại.','The clock returns to {v} and stops. Press Resume clock to run it again.'),{v:fmtMS(totalFor('main'))}),tt('Đặt lại','Reset'))){cset('main',false);save();render()}break;
    case 'adjust':adjusting=!adjusting;render();break;
    case 'endMain':endMainNow();break;
    case 'addExtra':addExtra();break;
    case 'startTie':tieStartClock();break;
    case 'claim':tieClaim(+d.v);break;
    case 'tieToggle':if(G.clocks.tie.remain>0){G.clocks.tie.running=!G.clocks.tie.running;save();render()}break;
    case 'tieReset':if(await confirmBox(tt('Đặt lại đồng hồ vòng phụ?','Reset the tie-breaker clock?'),fmt(tt('Đồng hồ quay về {v} và dừng.','The clock returns to {v} and stops.'),{v:fmtMS(totalFor('tie'))}),tt('Đặt lại','Reset'))){cset('tie',false);save();render()}break;
    case 'toEst':toEstimateNow();break;
    case 'estPick':{const pi=+d.v;const p=pi>=0?estPrep(pi):{q:'',a:''};Object.assign(G.e,{pi,q:p.q,correct:p.a,result:null,shown:false});save();render();break}
    case 'estShow':G.e.shown=true;sfx('click');save();render();break;
    case 'estCompare':estCompare();break;
    case 'estNew':estNew();break;
    case 'announce':estAnnounce();break;
    case 'prShuffle':prShuffle();break;
    case 'prEnd':endPractice();break;
  }}

const fx=(function(){const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],rockets=[],raf=0,rainUntil=0,rainRate=0,fwUntil=0,nextRocket=0;
  const COLS=['#ffc83d','#ffe48a','#ffffff','#5fd4ff','#3fb6ff','#ff5d73','#2ee59d','#ff9f1a'];
  function add(x,y,vx,vy,kind,c){parts.push({x,y,vx,vy,kind,w:8+Math.random()*10,h:5+Math.random()*7,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,c:c||COLS[(Math.random()*COLS.length)|0],life:0,max:kind==='spark'?60+Math.random()*40:160+Math.random()*120,wob:Math.random()*6.28})}
  function burst(x,y,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=6+Math.random()*12;add(x,y,Math.cos(a)*s,Math.sin(a)*s-8,'conf')}start()}
  function rain(ms,rate){rainUntil=performance.now()+ms;rainRate=rate;start()}
  function fireworks(ms){fwUntil=performance.now()+ms;nextRocket=0;start()}
  function explode(x,y){const c=COLS[(Math.random()*COLS.length)|0],c2=COLS[(Math.random()*COLS.length)|0];const n=70;for(let i=0;i<n;i++){const a=i/n*6.283,s=4+Math.random()*5;add(x,y,Math.cos(a)*s,Math.sin(a)*s,'spark',i%3?c:c2)}sfx('boom')}
  function start(){if(!raf)raf=requestAnimationFrame(step)}
  function stop(){parts=[];rockets=[];rainUntil=0;fwUntil=0}
  function step(t){cx.clearRect(0,0,1920,1080);
    if(stage.classList.contains('paused')){raf=requestAnimationFrame(step);return}
    if(t<rainUntil)for(let i=0;i<rainRate;i++)add(Math.random()*1920,-20,(Math.random()-.5)*3,2+Math.random()*4,'conf');
    if(t<fwUntil&&t>nextRocket){rockets.push({x:260+Math.random()*1400,y:1090,vy:-(15+Math.random()*5),vx:(Math.random()-.5)*3,ty:160+Math.random()*320});nextRocket=t+380+Math.random()*420}
    rockets=rockets.filter(r=>{r.x+=r.vx;r.y+=r.vy;r.vy+=.16;cx.fillStyle='#fff6d0';cx.beginPath();cx.arc(r.x,r.y,3.2,0,6.28);cx.fill();cx.fillStyle='rgba(255,200,61,.35)';cx.fillRect(r.x-1,r.y,2,26);if(r.y<=r.ty||r.vy>=-1){explode(r.x,r.y);return false}return true});
    parts=parts.filter(p=>p.life<p.max&&p.y<1120);
    for(const p of parts){p.life++;const fade=Math.min(1,(p.max-p.life)/30);
      if(p.kind==='spark'){p.vy+=.07;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;cx.globalAlpha=fade;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.6,0,6.28);cx.fill();continue}
      p.vy+=.28;p.vx*=.985;p.vy=Math.min(p.vy,7);p.wob+=.1;p.x+=p.vx+Math.sin(p.wob)*1.2;p.y+=p.vy;p.r+=p.vr;cx.globalAlpha=fade;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,Math.cos(p.wob));cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
    cx.globalAlpha=1;
    if(parts.length||rockets.length||t<rainUntil||t<fwUntil)raf=requestAnimationFrame(step);else{raf=0;cx.clearRect(0,0,1920,1080)}}
  return{burst,rain,fireworks,stop}})();

function buildQPane(){const tabs=[['qMain',tt('Câu hỏi chính (24)','Main (24)')],['qBackup',tt('Dự phòng (6)','Backup (6)')],['qTie',tt('Vòng phụ (5)','Tie-breaker (5)')],['qEst',tt('Ước lượng (3)','Estimation (3)')]];
  let h='<div class="note">'+tt('Mỗi câu có nội dung Tiếng Việt và English. Nếu chưa có bản dịch, game hiển thị nội dung đã nhập. Đáp án chỉ MC xem. Bấm Lưu cài đặt sau khi sửa.','Each question has Vietnamese and English fields. If one is missing, the other is shown. Answers are for the host only. Press Save settings after editing.')+'</div>'
   +sw('demo',tt('Chế độ demo: câu còn trống dùng phép tính đơn giản để thử toàn bộ luồng chơi (không dùng thông tin sản phẩm).','Demo mode: empty questions use simple arithmetic to test the full flow (no product information).'))
   +'<div class="qsub">'+tabs.map(([k,l])=>'<button data-qt="'+k+'" class="'+(qTab===k?'on':'')+'">'+l+'</button>').join('')+'</div>';
  const list=draft[qTab],est=qTab==='qEst',pre={qMain:'',qBackup:'B',qTie:'P',qEst:'E'}[qTab];
  if(qTab==='qTie')h+='<div class="note">'+tt('Nhập 3–5 câu. Câu để trống sẽ bị bỏ qua khi tắt chế độ demo.','Enter 3–5 questions. Empty ones are skipped when demo mode is off.')+'</div>';
  if(est)h+='<div class="note">'+tt('Đáp án phải là một con số. MC vẫn có thể sửa câu và đáp án ngay trong lúc chơi.','The answer must be a number. The host can still edit the question and answer during play.')+'</div>';
  h+='<div class="qhead'+(est?' est':'')+'"><div>#</div><div>'+tt('CÂU HỎI (VIỆT)','QUESTION (VI)')+'</div><div>QUESTION (EN)</div>'+(est?'<div>'+tt('ĐÁP ÁN (SỐ)','ANSWER (NUMBER)')+'</div>':'<div>'+tt('ĐÁP ÁN (VIỆT)','ANSWER (VI)')+'</div><div>ANSWER (EN)</div>')+'</div>';
  h+=list.map((q,i)=>{const n=pre+(pre?(i+1):pad(i+1));return '<div class="qline'+(est?' est':'')+'"><div class="no'+(pre==='B'?' bk':'')+'">'+n+'</div><textarea class="inp" rows="1" data-k="'+qTab+'.'+i+'.vi" placeholder="'+esc(fmt(tt('Nhập câu hỏi số {n}…','Question {n}…'),{n}))+'">'+esc(q.vi)+'</textarea><textarea class="inp" rows="1" data-k="'+qTab+'.'+i+'.en" placeholder="English…">'+esc(q.en)+'</textarea>'
    +(est?'<input class="inp" data-k="'+qTab+'.'+i+'.ans" inputmode="decimal" placeholder="'+tt('Nhập đáp án…','Answer…')+'" value="'+esc(q.ans)+'">':'<input class="inp" data-k="'+qTab+'.'+i+'.avi" placeholder="'+tt('Nhập đáp án…','Answer…')+'" value="'+esc(q.avi)+'"><input class="inp" data-k="'+qTab+'.'+i+'.aen" placeholder="Answer…" value="'+esc(q.aen)+'">')+'</div>'}).join('');
  $('#paneC').innerHTML=h}
function renderLogoPrev(){const m=draft?draft.logoMode:S.logoMode;let h;if(m==='custom'&&custom.logo)h='<img src="'+custom.logo+'">';else if(m==='default'&&A.logo)h='<img src="'+A.logo+'">';else if(m==='custom')h='<span style="font-size:18px;color:#9fcaf0">'+tt('Chưa có logo tải lên — đang hiện chữ SKECHERS','No uploaded logo — showing SKECHERS text')+'</span>';else h='<span class="wordmark">SKECHERS</span>';const e=$('#logoPrev');if(e)e.innerHTML=h}
function renderSlots(){const g=$('#shoesGrid');if(!g)return;g.innerHTML=Array.from({length:15},(_,i)=>{const c=custom.imgs[i];const st=c?(custom.saved[i]?'<span class="st cus">'+tt('Ảnh tải lên','Uploaded')+'</span>':'<span class="st tmp">'+tt('Chưa lưu được','Not saved')+'</span>'):'<span class="st">'+tt('Mặc định','Default')+'</span>';

function renderUsage(){const u=$('#usage');if(!u)return;let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('tm_')===0)n+=(localStorage.getItem(k)||'').length}}catch(e){}
  u.textContent=storageOK?fmt(tt('Bộ nhớ trình duyệt đang dùng khoảng {m} MB (giới hạn thường khoảng 5 MB) cho cài đặt và ảnh. Âm thanh lưu riêng.','About {m} MB of browser storage is used (the usual limit is about 5 MB) for settings and images. Audio is stored separately.'),{m:(n*2/1048576).toFixed(1)}):tt('Trình duyệt đang chặn bộ nhớ: cài đặt và ảnh sẽ không được lưu.','Browser storage is blocked: settings and images will not be saved.')}
$('#setTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)selTab(b.dataset.t)});
function onField(el){if(!draft||!el.dataset.k)return;const k=el.dataset.k;let v=el.type==='checkbox'?el.checked:el.value;if(el.type==='radio'){if(!el.checked)return}
  if(el.dataset.num)v=parseFloat(v);if(el.dataset.num&&isNaN(v))return;setPath(draft,k,v);dirty=true;setMsg(tt('Có thay đổi chưa lưu.','Unsaved changes.'));
  if(k==='logoMode')renderLogoPrev();if(k==='musicVol'){bgm.volume=v}if(k==='musicLoop')bgm.loop=!!v}
$('#setM').addEventListener('input',e=>onField(e.target));$('#setM').addEventListener('change',e=>onField(e.target));
$('#setM').addEventListener('click',async e=>{const qt=e.target.closest('[data-qt]');if(qt){qTab=qt.dataset.qt;buildQPane();return}

  if(del){const k=del.dataset.del;

    if(k==='allshoes'){if(!await confirmBox(tt('Dùng lại ảnh mặc định?','Restore default images?'),tt('Toàn bộ ảnh giày đã tải lên sẽ bị xóa.','All uploaded shoe images will be removed.'),tt('Đồng ý','OK'),true))return;for(let i=0;i<15;i++){custom.imgs[i]=null;custom.saved[i]=false;LS.del(K.IMG(i+1))}afterImg();setMsg(tt('Đã dùng lại toàn bộ ảnh mặc định.','All default images restored.'),'ok')}
    if(k==='logo'){custom.logo=null;LS.del(K.LOGO);LS.del('txsk_logo_v1');if(draft.logoMode==='custom'){draft.logoMode='default';S.logoMode='default';saveSettings()}buildSettings();applyBranding();setMsg(tt('Đã xóa logo tải lên.','Uploaded logo removed.'),'ok')}
    if(k==='rev'){custom.rev=null;LS.del(K.REV);$('#revPrev').src=revSrc();applyBranding();setMsg(tt('Đã dùng lại ảnh bí mật mặc định.','Default hidden picture restored.'),'ok')}
    if(k==='bg'){custom.bg=null;LS.del(K.BG);$('#bgPrev').src=bgSrc();applyBranding();setMsg(tt('Đã dùng lại ảnh nền mặc định.','Default background restored.'),'ok')}}
  if(aup){pendingAudio=aup.dataset.aup;$('#fileAudio').value='';$('#fileAudio').click()}
  if(atest){if(atest.dataset.atest==='music'){musicToggle();setTimeout(()=>{if(draft)buildSettings(),selTab('E')},150)}else playFanfare()}
  if(adel){const k=adel.dataset.adel;if(k==='music')bgm.pause();setAudio(k,null);await IDB.del(k);await IDB.del(k+'_name');buildSettings();selTab('E');refreshTools();setMsg(k==='music'?tt('Đã gỡ nhạc nền.','Music removed.'):tt('Đang dùng kèn tổng hợp có sẵn.','Using the built-in fanfare.'),'ok')}
  if(e.target.id==='setReplay'){if(await confirmBox(tt('Chơi lại trận mới?','Start a new match?'),tt('Điểm, đồng hồ và bảng chơi hiện tại sẽ bị xóa. Cài đặt được giữ nguyên.','Scores, clocks and the current board will be cleared. Settings are kept.'),tt('Chơi lại','Play again'),true)){$('#setM').classList.remove('show');draft=null;openSetup()}}
  if(e.target.id==='setFactory'){if(!await confirmBox(tt('Khôi phục cài đặt gốc?','Factory reset?'),tt('Mọi cài đặt, câu hỏi, ảnh, âm thanh và tiến độ trên trình duyệt này sẽ bị xóa vĩnh viễn.','All settings, questions, images, audio and progress in this browser will be permanently deleted.'),tt('Xóa và khôi phục','Delete and reset'),true))return;

});

  const lim={main:[1,90],answer:[5,300],flip:[5,120],hold:[1,30],tie:[.5,15]};Object.keys(lim).forEach(k=>{let v=+draft.times[k];if(isNaN(v))v=defaults().times[k];draft.times[k]=Math.min(lim[k][1],Math.max(lim[k][0],v))});
  const prev=S;S=clone(draft);if(!saveSettings()){S=prev;setMsg(tt('LƯU THẤT BẠI: trình duyệt không cho lưu (bộ nhớ đầy hoặc bị chặn). Cài đặt chưa được áp dụng.','SAVE FAILED: the browser refused to save (storage full or blocked). Settings were not applied.'),'err');return}
  dirty=false;['main','ans','flip','hold','tie'].forEach(n=>{const c=G.clocks[n];if(c&&!c.running&&c.remain===c.total){c.total=c.remain=totalFor(n)}});save();
  applyMusicSettings();applyBranding();render();if(screen==='result')renderResult();if(screen==='welcome')renderWelcome();
  const tab=($('#setTabs button.on')||{}).dataset;draft=clone(S);buildSettings();if(tab)selTab(tab.t);setMsg(tt('Đã lưu cài đặt thành công.','Settings saved.'),'ok');toast(tt('Đã lưu cài đặt','Settings saved'),'good')};
$('#setCancel').onclick=closeSettings;$('#setX').onclick=closeSettings;
let pendingUp=null,pendingAudio=null;
function compress(file,maxSide,mime,quality,fill){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type))return rej(new Error(fmt(tt('Tệp “{f}” không phải là ảnh.','“{f}” is not an image.'),{f:file&&file.name})));
  if(file.size>30*1048576)return rej(new Error(fmt(tt('Ảnh “{f}” quá lớn (trên 30 MB).','“{f}” is too large (over 30 MB).'),{f:file.name})));
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,maxSide/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    if(fill){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);let q=quality,d=c.toDataURL(mime,q);while(mime==='image/jpeg'&&d.length>460000&&q>.45){q-=.1;d=c.toDataURL(mime,q)}res(d)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error(fmt(tt('Không đọc được ảnh “{f}”.','Could not read “{f}”.'),{f:file.name})))};img.src=url})}
async function putShoe(i,file){const d=await compress(file,700,'image/jpeg',.86,true);custom.imgs[i]=d;const ok=LS.set(K.IMG(i+1),d);custom.saved[i]=ok;return ok}
function afterImg(){renderSlots();applyBranding();if(screen==='game')render();renderUsage()}
const notSaved=tt(' — đang dùng tạm nhưng KHÔNG LƯU ĐƯỢC (vượt dung lượng lưu trữ). Cần chọn lại sau khi đóng trình duyệt.',' — in use for now but NOT SAVED (storage full). Select it again after closing the browser.');
$('#fileOne').addEventListener('change',async e=>{const f=e.target.files[0];if(!f||!pendingUp)return;const p=pendingUp;pendingUp=null;setMsg(tt('Đang xử lý ảnh…','Processing image…'));
  try{if(p.kind==='shoe'){const ok=await putShoe(p.i,f);afterImg();ok?setMsg(fmt(tt('Đã lưu Ảnh {n}.','Image {n} saved.'),{n:pad(p.i+1)}),'ok'):setMsg(tt('Ảnh ','Image ')+pad(p.i+1)+notSaved,'err')}
    else if(p.kind==='logo'){const d=await compress(f,900,'image/png',1,false);if(d.length>1500000)throw new Error(tt('Logo quá lớn sau khi nén. Hãy dùng PNG nhỏ hơn.','The logo is too large after compression. Use a smaller PNG.'));custom.logo=d;const ok=LS.set(K.LOGO,d);draft.logoMode='custom';S.logoMode='custom';saveSettings();buildSettings();applyBranding();ok?setMsg(tt('Đã lưu logo.','Logo saved.'),'ok'):setMsg('Logo'+notSaved,'err')}
    else{const d=await compress(f,1920,'image/jpeg',.8,true);const key=p.kind==='rev'?K.REV:K.BG;custom[p.kind]=d;const ok=LS.set(key,d);$('#'+(p.kind==='rev'?'revPrev':'bgPrev')).src=d;applyBranding();ok?setMsg(tt('Đã lưu ảnh.','Image saved.'),'ok'):setMsg(tt('Ảnh','Image')+notSaved,'err')}
  }catch(err){setMsg(err.message||tt('Không xử lý được ảnh.','Could not process the image.'),'err')}renderUsage()});
$('#fileMany').addEventListener('change',async e=>{const files=Array.from(e.target.files||[]);if(!files.length)return;setMsg(tt('Đang xử lý ảnh…','Processing images…'));
  const num=f=>{const m=f.name.match(/(\d+)/);return m?parseInt(m[1]):NaN};const taken=new Set(),plan=[];files.forEach(f=>{const n=num(f);if(n>=1&&n<=15&&!taken.has(n-1)){taken.add(n-1);plan.push([n-1,f])}});
  let nx=0;files.forEach(f=>{if(plan.some(p=>p[1]===f))return;while(taken.has(nx)&&nx<15)nx++;if(nx<15){taken.add(nx);plan.push([nx,f])}});
  let okN=0;const fail=[],err=[];for(const [i,f] of plan){try{(await putShoe(i,f))?okN++:fail.push(pad(i+1))}catch(x){err.push(x.message)}}afterImg();
  if(!fail.length&&!err.length)setMsg(fmt(tt('Đã lưu {n} ảnh.','{n} images saved.'),{n:okN}),'ok');else setMsg((okN?fmt(tt('Đã lưu {n} ảnh. ','{n} images saved. '),{n:okN}):'')+(fail.length?fmt(tt('KHÔNG LƯU ĐƯỢC ảnh {l} (vượt dung lượng, chỉ dùng tạm). ','Images {l} NOT SAVED (storage full, session only). '),{l:fail.join(', ')}):'')+(err[0]||''),'err')});
$('#fileAudio').addEventListener('change',async e=>{const f=e.target.files[0];const kind=pendingAudio;pendingAudio=null;if(!f||!kind)return;
  if(!/^audio\//.test(f.type)&&!/\.(mp3|wav|ogg|m4a|aac)$/i.test(f.name)){setMsg(tt('Tệp này không phải file âm thanh.','This is not an audio file.'),'err');return}
  if(f.size>60*1048576){setMsg(tt('File âm thanh quá lớn (trên 60 MB).','The audio file is too large (over 60 MB).'),'err');return}
  const probe=document.createElement('audio');if(f.type&&!probe.canPlayType(f.type)){setMsg(tt('Trình duyệt không phát được định dạng này. Hãy dùng MP3 hoặc WAV.','This browser cannot play that format. Use MP3 or WAV.'),'err');return}
  if(kind==='music')bgm.pause();const ok=(await IDB.put(kind,f))&&(await IDB.put(kind+'_name',f.name));setAudio(kind,f,f.name,ok);buildSettings();selTab('E');refreshTools();
  setMsg(ok?fmt(tt('Đã lưu “{f}” trên trình duyệt này.','“{f}” saved in this browser.'),{f:f.name}):fmt(tt('“{f}” chỉ dùng trong phiên này: không lưu được. Cần chọn lại sau khi đóng trình duyệt.','“{f}” is for this session only: it could not be saved. Select it again after closing the browser.'),{f:f.name}),ok?'ok':'err')});

  fx.stop();tasks=[];busy=false;bigQ=false;adjusting=false;mode='match';G=freshGame(suFirst);save();setPaused(false);hideBanner();cleanBoards();show('game');render()};

$$('.js-sound').forEach(b=>b.onclick=()=>{S.sfx=!S.sfx;saveSettings();refreshTools();if(S.sfx)sfx('click');toast(S.sfx?tt('Đã bật hiệu ứng âm thanh','Sound effects on'):tt('Đã tắt hiệu ứng âm thanh','Sound effects off'))});

$$('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('show'));

function setLang(l){if(l===S.lang)return;S.lang=l;saveSettings();applyI18n();if(screen==='welcome')renderWelcome();if(screen==='game')render();if(screen==='result')renderResult();if($('#setM').classList.contains('show')&&draft){draft.lang=l;const tb=($('#setTabs button.on')||{}).dataset;buildSettings();if(tb)selTab(tb.t)}}
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select'))return;const k=e.key.toLowerCase();
  if(k==='escape'){if(confirmRes){confirmRes(false);return}for(const id of ['helpM','setupM']){if($('#'+id).classList.contains('show')){$('#'+id).classList.remove('show');return}}if($('#setM').classList.contains('show')){closeSettings();return}if(bigQ){bigQ=false;render()}return}
  if($('.modal-bg.show'))return;
  if(k==='f')toggleFS();else if(k==='m')$('.js-sound').click();else if(k==='p'&&screen==='game')setPaused(!paused);else if(k==='h'&&screen==='game')toggleCollapse()});

function recover(){
  if(G.stage==='main'){const m=G.m;if(m.phase==='resolve'||m.phase==='flip'&&m.picks.length>=2){m.picks=[];if(found()>=8||G.clocks.main.remain<=0)m.phase='ended';else{m.turn=1-m.turn;m.phase='question';m.q=null;m.ansShown=false;G.clocks.ans={remain:totalFor('ans'),total:totalFor('ans'),running:false};G.clocks.flip={remain:totalFor('flip'),total:totalFor('flip'),running:false}}}
    if(m.phase==='ended')decideMain(false)}
  else if(G.stage==='tie'&&G.t){const T=G.t;if(G.r&&T.phase==='ended')G.stage='result';else if(T.phase==='resolve'){T.picks=[];if(T.q)T.used[T.q.i]=true;T.q=null;T.answering=null;T.tried=[];T.phase='question';if(G.clocks.tie.remain<=0||!tieAvail().length){const p=estPrep(0);G.stage='estimate';G.e={pi:0,q:p.q,correct:p.a,a:['',''],shown:false,result:null,round:1}}}}
  G.clocks.hold.running=false;
  if(G.stage!=='result'&&CLN.some(n=>G.clocks[n].running))paused=true;
  save()}
recover();
